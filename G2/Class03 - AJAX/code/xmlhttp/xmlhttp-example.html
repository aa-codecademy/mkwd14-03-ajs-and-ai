<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XML HTTP Request</title>
</head>

<body>
    <h1>XML HTTP Request</h1>

    <!-- Forms perform a full-page reload when submitted unless explicitly prevented using JavaScript -->
    <!-- The response from the server will replace the current page, making it difficult to handle or display the data dynamically -->
    <form action="https://api.chucknorris.io/jokes/random" method="get">
        <button>Get Data</button>
    </form>

    <script src="./xmlhttp-example.js"></script>
</body>

</html>
