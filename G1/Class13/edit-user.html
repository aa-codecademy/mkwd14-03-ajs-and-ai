<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit User</title>

  <!-- Bootstrap CSS (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
  <main class="container py-5">
    <h1 class="mb-4">Edit User</h1>

    <form id="userForm">
      <div class="row g-3 align-items-end">
        <div class="col-auto">
          <label for="userId" class="form-label">User ID</label>
          <input type="number" class="form-control" id="userId" placeholder="Enter user id" />
        </div>

        <div class="col-auto">
          <button type="button" class="btn btn-primary" id="loadUserBtn">Load</button>
        </div>
      </div>

      <hr class="my-4" />

      <div class="row g-3">
        <div class="col-md-6">
          <label for="name" class="form-label">Name</label>
          <input type="text" class="form-control" id="name" placeholder="Full name" />
        </div>

        <div class="col-md-6">
          <label for="username" class="form-label">Username</label>
          <input type="text" class="form-control" id="username" placeholder="Username" />
        </div>

        <div class="col-md-6">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" placeholder="Email address" />
        </div>

        <div class="col-md-6">
          <label for="companyName" class="form-label">Company Name</label>
          <input type="text" class="form-control" id="companyName" placeholder="Company name" />
        </div>

        <div class="col-md-6">
          <label for="city" class="form-label">City</label>
          <input type="text" class="form-control" id="city" placeholder="City" />
        </div>

        <div class="col-md-6">
          <label for="street" class="form-label">Street</label>
          <input type="text" class="form-control" id="street" placeholder="Street" />
        </div>
      </div>

      <div class="mt-4">
        <button type="submit" class="btn btn-success" id="saveUserBtn">Save</button>
      </div>
    </form>

    <section class="mt-5">
      <h2 class="mb-3">Users</h2>
      <div class="table-responsive">
        <table class="table table-striped" id="usersTable">
          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Name</th>
              <th scope="col">Username</th>
              <th scope="col">Email</th>
              <th scope="col">City</th>
              <th scope="col">Street</th>
              <th scope="col">Company</th>
              <th scope="col">Actions</th>
            </tr>
          </thead>
          <tbody>
            <!-- User rows will be inserted here -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Bootstrap JS bundle (optional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script type="module" src="./scripts/users.js"></script>
</body>
</html>
